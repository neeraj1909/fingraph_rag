name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked orchestration dependencies
        run: uv sync --locked --extra orchestration --dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Full test suite
        run: uv run pytest --no-cov

      - name: Validate Compose model
        run: docker compose -f docker/compose.yaml config --quiet

      - name: Start storage dependencies
        run: >-
          docker compose -f docker/compose.yaml up -d
          --wait --wait-timeout 240 postgres redis neo4j qdrant

      - name: Check storage readiness
        run: uv run python scripts/check_health.py --required postgres redis neo4j qdrant

      - name: Storage integration tests
        env:
          FINGRAPH_RUN_NEO4J_INTEGRATION: '1'
          FINGRAPH_RUN_STORAGE_INTEGRATION: '1'
          NEO4J_HTTP_URL: http://localhost:7474
          NEO4J_PASSWORD: change-me-before-use
          QDRANT_URL: http://localhost:6333
        run: >-
          uv run pytest --no-cov
          tests/integration/test_graph_neo4j.py
          tests/integration/test_qdrant_store.py
          tests/integration/test_retrieval_live.py

      - name: Build API image
        run: docker compose -f docker/compose.yaml build api

      - name: Collect storage diagnostics
        if: failure()
        run: |
          docker compose -f docker/compose.yaml ps --all
          docker compose -f docker/compose.yaml logs --no-color --tail 200 postgres redis neo4j qdrant

      - name: Remove CI services
        if: always()
        run: docker compose -f docker/compose.yaml down -v
