[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fingraph-rag"
version = "0.1.0"
description = "Observable, guardrailed financial GraphRAG foundations."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "FinGraph-RAG contributors" }]
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
orchestration = [
    "langgraph>=0.2,<1",
    "pydantic-ai>=0.0.30,<1",
    "fastapi>=0.115,<0.120",
    "uvicorn>=0.34,<1",
    "langgraph-checkpoint-sqlite>=2,<3",
    "aiosqlite==0.21.0",
    "opentelemetry-api==1.37.0",
    "opentelemetry-sdk==1.37.0",
    "opentelemetry-exporter-otlp-proto-http==1.37.0",
]
parsing = [
    "docling==2.129.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fingraph_rag"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "unit: fast tests without external services",
    "contract: boundary and dependency-direction tests",
    "integration: local application-boundary tests",
    "security: adversarial fail-closed policy tests",
    "e2e: real application and HTTP boundary tests",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["fingraph_rag"]

[tool.coverage.run]
branch = true
source = ["src/fingraph_rag"]
